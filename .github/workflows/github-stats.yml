name: Generate GitHub Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        run: |
          mkdir -p profile

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=kamalabuzarifa&show_icons=true&include_all_commits=true&hide_border=true" \
            -o profile/stats.svg

          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=kamalabuzarifa&layout=compact&hide_border=true" \
            -o profile/top-langs.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
