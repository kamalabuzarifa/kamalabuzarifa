name: Generate GitHub Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          python3 <<'PY'
          import json
          import os
          import urllib.request

          username = "kamalabuzarifa"
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_api(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          user = github_api(
              f"https://api.github.com/users/{username}"
          )

          repos = github_api(
              f"https://api.github.com/users/{username}/repos?per_page=100"
          )

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)

          total_stars = 0

          languages = {}

          for repo in repos:
              total_stars += repo.get("stargazers_count", 0)

              if not repo.get("fork", False):
                  lang_url = repo.get("languages_url")

                  if lang_url:
                      repo_languages = github_api(lang_url)

                      for language, bytes_count in repo_languages.items():
                          languages[language] = (
                              languages.get(language, 0) + bytes_count
                          )

          sorted_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )

          total_language_bytes = sum(
              value for _, value in sorted_languages
          )

          top_languages = []

          for language, value in sorted_languages[:6]:
              percentage = (
                  value / total_language_bytes * 100
                  if total_language_bytes
                  else 0
              )

              top_languages.append(
                  (language, percentage)
              )

          width = 700
          height = 330

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">
          <rect width="100%" height="100%" rx="12" fill="#ffffff" stroke="#e4e4e4"/>

          <text x="35" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#24292f">
            Kamal Abu Zarifa
          </text>

          <text x="35" y="78" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            GitHub Statistics
          </text>

          <text x="55" y="135" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Public Repositories
          </text>

          <text x="55" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#24292f">
            {public_repos}
          </text>

          <text x="260" y="135" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Total Stars
          </text>

          <text x="260" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#24292f">
            {total_stars}
          </text>

          <text x="465" y="135" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Followers
          </text>

          <text x="465" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#24292f">
            {followers}
          </text>

          <text x="55" y="225" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Following
          </text>

          <text x="55" y="255" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#24292f">
            {following}
          </text>

          <text x="260" y="225" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Repositories With Code
          </text>

          <text x="260" y="255" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#24292f">
            {sum(1 for repo in repos if not repo.get("fork", False))}
          </text>

          <text x="465" y="225" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
            Account
          </text>

          <text x="465" y="255" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#24292f">
            GitHub
          </text>

          <text x="35" y="305" font-family="Arial, sans-serif" font-size="12" fill="#8c959f">
            Updated automatically by GitHub Actions
          </text>

          </svg>'''

          with open("profile/stats.svg", "w", encoding="utf-8") as file:
              file.write(stats_svg)

          language_rows = ""

          y = 95

          for language, percentage in top_languages:
              language_rows += f'''
              <text x="45" y="{y}" font-family="Arial, sans-serif" font-size="15" fill="#24292f">
                {language}
              </text>

              <text x="600" y="{y}" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#57606a">
                {percentage:.1f}%
              </text>
              '''

              y += 42

          languages_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
          <rect width="100%" height="100%" rx="12" fill="#ffffff" stroke="#e4e4e4"/>

          <text x="35" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#24292f">
            Top Languages
          </text>

          {language_rows}

          <text x="35" y="335" font-family="Arial, sans-serif" font-size="12" fill="#8c959f">
            Generated from GitHub repository language data
          </text>

          </svg>'''

          with open("profile/top-langs.svg", "w", encoding="utf-8") as file:
              file.write(languages_svg)

          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi
